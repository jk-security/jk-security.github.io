<figure class="evidence-figure">
  {% if include.link %}
    <a
      href="{{ include.link | relative_url }}"
      target="_blank"
      rel="noopener"
      aria-label="Open {{ include.alt }} at full resolution"
    >
  {% endif %}

  <img
    src="{{ include.src | relative_url }}"
    alt="{{ include.alt }}"
    loading="lazy"
  >

  {% if include.link %}
    </a>
  {% endif %}

  {% if include.caption %}
    <figcaption>{{ include.caption }}</figcaption>
  {% endif %}
</figure>
