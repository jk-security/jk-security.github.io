<header class="site-header" role="banner">
  <div class="wrapper site-header-wrapper">
    <a
      class="site-title"
      rel="author"
      href="{{ '/' | relative_url }}"
      aria-label="{{ site.title | escape }} home"
    >
      {{ site.title | escape }}
    </a>

    <button
      class="mobile-nav-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="primary-navigation"
    >
      Menu
    </button>

    <nav
      id="primary-navigation"
      class="site-nav-custom"
      aria-label="Primary navigation"
    >
      <a
        class="page-link"
        href="{{ '/' | relative_url }}"
        {% if page.url == '/' %}aria-current="page"{% endif %}
      >
        Home
      </a>

      <details class="nav-menu">
        <summary
          class="page-link nav-menu__toggle"
          {% if page.url contains '/projects/' %}aria-current="page"{% endif %}
        >
          Projects
        </summary>

        <div class="nav-menu__panel" aria-label="Project navigation">
          <a href="{{ '/projects/' | relative_url }}">
            All projects
          </a>

          <a
            href="{{ '/projects/mockco/' | relative_url }}"
            {% if page.url == '/projects/mockco/' %}aria-current="page"{% endif %}
          >
            MockCo context
          </a>

          {% for project in site.data.projects %}
            <a
              href="{{ project.route | relative_url }}"
              {% if page.url == project.route %}aria-current="page"{% endif %}
            >
              {{ project.name }}
            </a>
          {% endfor %}
        </div>
      </details>

      <a
        class="page-link"
        href="{{ '/about/' | relative_url }}"
        {% if page.url == '/about/' %}aria-current="page"{% endif %}
      >
        About
      </a>

      <details class="nav-menu nav-menu--more">
        <summary
          class="page-link nav-menu__toggle"
          {% if page.url contains '/reading/' or page.url contains '/notes/' or page.url contains '/cka-study/' %}
            aria-current="page"
          {% endif %}
        >
          More
        </summary>

        <div class="nav-menu__panel" aria-label="Secondary navigation">
          <a
            href="{{ '/reading/' | relative_url }}"
            {% if page.url contains '/reading/' %}aria-current="page"{% endif %}
          >
            Reading
          </a>

          <a
            href="{{ '/notes/' | relative_url }}"
            {% if page.url contains '/notes/' %}aria-current="page"{% endif %}
          >
            Notes
          </a>

          <a
            href="{{ '/cka-study/' | relative_url }}"
            {% if page.url contains '/cka-study/' %}aria-current="page"{% endif %}
          >
            CKA Study
          </a>

          <a
            href="https://github.com/jk-security"
            rel="me noopener noreferrer"
          >
            GitHub
          </a>
        </div>
      </details>
    </nav>
  </div>
</header>

<script src="{{ '/assets/js/site-navigation.js' | relative_url }}" defer></script>
