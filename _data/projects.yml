- id: member-portal
  latest_milestone: "The encrypted-envelope model and intended browser-side plaintext boundary are documented; browser key handling remains deferred."
  name: Member Portal
  subtitle: Secure Member-Facing Application and Protected Data Architecture
  route: /projects/mockco/member-portal/
  status: Active
  repository_url: ""
  summary: >-
    Member Portal is MockCo's secure member-facing application for exercising
    identity, authorization, delegated access, account-security workflows, and
    protected-data delivery across multiple trust zones. Its architecture
    minimizes routine plaintext exposure by carrying protected content through
    intermediary services and bounding decryption to explicitly authorized
    endpoints.
  tags:
    - Secure architecture
    - Protected data
    - Trust boundaries
    - Authorization
  image: ""
  image_alt: Member Portal data flow showing protected records crossing security zones while remaining encrypted
  image_caption: Protected records remain encrypted across intermediary trust zones.
  featured: false

- id: logq
  latest_milestone: "The V3.0 local ingestion foundation is implemented with Unix datagrams, append-only JSONL segments, and reconciliation evidence."
  name: LogQ
  subtitle: Append-Only Observability for AI Coding Agents
  route: /projects/agentic-development/logq/
  status: Complete
  repository_url: ""
  summary: >-
    LogQ is an observability system for measuring how AI coding agents behave
    across development runs. It captures lifecycle, workflow, validation, and
    intervention events as structured operational evidence, using a lightweight
    append-only event path designed to keep telemetry off the agent execution
    critical path.
  tags:
    - Observability
    - Event streams
    - Reconciliation
    - Agent telemetry
  image: ""
  image_alt: LogQ event flow from coding agents through local collection into closed append-only JSONL segments
  image_caption: Agent events are collected, persisted, closed into segments, and reconciled.
  featured: true
