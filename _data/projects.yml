- id: member-portal
  latest_milestone: "The encrypted-envelope model and intended browser-side plaintext boundary are documented; browser key handling remains deferred."
  name: Member Portal
  subtitle: Secure Member-Facing Application and Protected Data Architecture
  route: /projects/mockco/member-portal/
  status: Active
  repository_url: ""
  summary: >-
    Examines how a public member application should handle sensitive records
    across internet, DMZ, production, and crown-jewel boundaries. The design
    keeps protected data encrypted through intermediary systems and restricts
    plaintext access to explicitly authorized endpoints and workflows.
  tags:
    - Secure architecture
    - Protected data
    - Trust boundaries
    - Authorization
  image: ""
  image_alt: Member Portal data flow showing protected records crossing security zones while remaining encrypted
  image_caption: Protected records remain encrypted across intermediary trust zones.
  featured: false

- id: logq
  latest_milestone: "The V3.0 local ingestion foundation is implemented with Unix datagrams, append-only JSONL segments, and reconciliation evidence."
  name: LogQ
  subtitle: Append-Only Observability for AI Coding Agents
  route: /projects/agentic-development/logq/
  status: Complete
  repository_url: ""
  summary: >-
    Captures coding-agent lifecycle, tool, workflow, and validation events as
    append-only JSONL records. LogQ closes durable event segments, reconciles
    attempted and persisted records, and provides durable evidence for evaluating agent
    behavior, failures, throughput, and governance overhead.
  tags:
    - Observability
    - Event streams
    - Reconciliation
    - Agent telemetry
  image: ""
  image_alt: LogQ event flow from coding agents through local collection into closed append-only JSONL segments
  image_caption: Agent events are collected, persisted, closed into segments, and reconciled.
  featured: true

- id: agent-harness
  latest_milestone: "The V3 operating model is active with bounded work lanes, explicit Human Lead authority, and LogQ-backed observability."
  name: Agent Harness
  subtitle: Multi-Agent Development Governance and Observability
  route: /projects/agentic-development-governance/
  status: Active
  repository_url: ""
  summary: >-
    Defines how multiple coding agents operate within bounded workstreams while
    a Human Lead retains architectural and Git authority. The harness makes
    roles, allowed actions, validation evidence, stop conditions, and handoffs
    explicit so autonomy can increase without removing reviewability.
  tags:
    - Agent governance
    - Bounded autonomy
    - Validation evidence
    - Development workflow
  image: ""
  image_alt: Agent Harness workflow showing bounded agents producing validated work for Human Lead review
  image_caption: Bounded agent workstreams converge on validation and Human Lead acceptance.
  featured: false

