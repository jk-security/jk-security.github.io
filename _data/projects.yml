- id: appsec-dvwa
  latest_milestone: "Six remediation labs have completed the exploit, correction, rebuild, and security re-test cycle."
  name: AppSec DVWA
  subtitle: Exploit Validation and Secure Remediation Lab
  route: /projects/appsec-dvwa/
  status: Paused
  repository_url: ""
  summary: >-
    AppSec DVWA is a hands-on application-security remediation lab for
    practicing the full path from exploit confirmation to secure code
    correction. Each exercise reproduces a vulnerability, traces it to the
    implementation, changes the application, rebuilds it, and verifies that
    the original exploit no longer succeeds.
  tags:
    - Application security
    - Exploit validation
    - Secure remediation
    - Regression testing
  image: ""
  image_alt: DVWA remediation lifecycle from exploit reproduction through source correction, rebuild, and security re-test
  image_caption: Each lab moves from confirmed exploit to corrected code and failed re-test.
